services:
  api:
    build: .
    restart: unless-stopped
    environment:
      CAMERA_DEVICE_ID: ${CAMERA_DEVICE_ID:?Run init_config.py first}
      CAMERA_DEVICE_TOKEN: ${CAMERA_DEVICE_TOKEN:?Run init_config.py first}
      CAMERA_ADMIN_USER: ${CAMERA_ADMIN_USER:-admin}
      CAMERA_ADMIN_PASSWORD: ${CAMERA_ADMIN_PASSWORD:?Run init_config.py first}
      CAMERA_STORAGE_BYTES: ${CAMERA_STORAGE_BYTES:-2147483648}
    volumes:
      - camera_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Run init_config.py --host YOUR_DNS_HOST first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: 10m
        max-file: "3"
volumes:
  camera_data:
  caddy_data:
  caddy_config:
